_BASE_: ../../Base_R50.yaml
MODEL:
  META_ARCHITECTURE: "pmt_online"
  BACKBONE:
    NAME: "PMT"
    NUM_BLOCKS: 6
    IMG_SIZE: 640
    NUM_CLASSES: 40
    HIDDEN_DIM: 1024
    SIZE_DIVISIBILITY: 32
    NUM_OBJECT_QUERIES: 200
    MASKED_ATTN_ENABLED: False
    DECODER_TYPE: "online"
    FROZEN_ENCODER: True
    # TIPSv2 ViT-Large backbone (patch_size=14, img_size=448 native, 640 for training)
    # Available variants: tipsv2_small | tipsv2_base | tipsv2_large | tipsv2_so400m | tipsv2_giant
    MODEL_NAME: "tipsv2_large"
    INTERACTION_INDICES: [5, 11, 17, 23]

  # TIPSv2 expects pixel values in [0, 1] range (no ImageNet normalization).
  # mean=(0,0,0), std=(255,255,255) converts detectron2's [0,255] uint8 to [0,1] float.
  PIXEL_MEAN: [0.0, 0.0, 0.0]
  PIXEL_STD: [255.0, 255.0, 255.0]

SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 0.0001
  WEIGHT_DECAY: 0.05
  POLY_POWER: 0.9
  WARMUP_STEPS: 6000
  MAX_ITER: 60000

INPUT:
  SAMPLING_FRAME_NUM: 5
  SAMPLING_FRAME_RANGE: 2
